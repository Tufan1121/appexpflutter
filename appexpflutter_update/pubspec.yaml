name: appexpflutter_update
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  api_client:
    path: packages/api_client
  auto_size_text: ^3.0.0
  carousel_slider: ^5.1.1
  change_app_package_name: ^1.2.0
  collection: ^1.18.0
  connectivity_plus: ^6.0.3
  cupertino_icons: ^1.0.6
  device_info_plus: ^12.3.0
  dio: ^5.4.3+1
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_hooks: ^0.21.3+1
  flutter_pdfview: ^1.3.2
  flutter_secure_storage: ^10.0.0
  font_awesome_flutter: ^10.7.0
  fpdart: ^1.1.0
  get_it: ^9.2.0
  go_router: ^17.0.1
  google_fonts: ^7.0.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  mobile_scanner: ^7.1.4
  open_file: ^3.3.2
  path_provider: ^2.1.3
  permission_handler: ^12.0.1
  photo_view: ^0.15.0
  reactive_forms: ^18.2.2
  rxdart: ^0.28.0
  share_plus: ^12.0.1
  shared_preferences: ^2.2.3
  syncfusion_flutter_charts: ^32.1.23
  syncfusion_flutter_datagrid: ^32.1.23
  syncfusion_flutter_pdfviewer: ^32.1.23
  url_launcher: ^6.3.1

dev_dependencies:
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.4
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.1.3

dependency_overrides:
  url_launcher_ios: ^6.3.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/iconos/GRUPO-TUFAN-LOGO-CUADRADO.ico"
  min_sdk_android: 21 # android min sdk min:16, default 21
  # web:
  #   generate: true
  #   image_path: "assets/icon/icon.png"
  #   background_color: "#hexcode"
  #   theme_color: "#hexcode"
  # windows:
  #   generate: true
  #   image_path: "assets/icon/icon.png"
  #   icon_size: 48 # min:48, max:256, default: 48
  # macos:
  #   generate: true
  #   image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/env
    - assets/loaders/
    - assets/images/
    - assets/iconos/
    - assets/iconos/qr/
    - google_fonts/montserrat_alternates/

# Splash de arranque - índigo con el logo TUFAN.
# Se usa `splash_logo.png` (cuadrado 1152 con el logo centrado y margen) para
# que en Android 12+ el logo quepa dentro del círculo del splash sin recortarse.
flutter_native_splash:
  color: "#0B1020"
  image: assets/images/splash_logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#0B1020"
    image: assets/images/splash_logo.png
