allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    // Solo redirigir el buildDir cuando el subproyecto vive en la misma unidad
    // que el buildDir raiz. Los plugins del pub cache estan en C: y el proyecto
    // en F:, y AGP truena al relativizar rutas entre unidades distintas
    // ("this and base files have different roots").
    if (project.projectDir.toPath().root == rootProject.buildDir.toPath().root) {
        project.buildDir = "${rootProject.buildDir}/${project.name}"
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
